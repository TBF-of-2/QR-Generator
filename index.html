<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Generator — by TBFPUMBA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            color: #33ff33;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: #0d0d0d;
            border: 2px solid #33ff33;
            border-radius: 12px;
            padding: 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 40px rgba(51, 255, 51, 0.1);
        }
        h1 {
            font-size: 24px;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #33ff33;
            text-shadow: 0 0 10px #33ff33;
        }
        .sub {
            color: #226622;
            font-size: 13px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 10px;
            background: #111;
            border: 1px solid #33ff33;
            color: #33ff33;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border-radius: 4px;
            outline: none;
            box-sizing: border-box;
        }
        input:focus {
            box-shadow: 0 0 15px rgba(51, 255, 51, 0.2);
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            background: #33ff33;
            color: #0a0a0a;
            border: none;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            letter-spacing: 1px;
            transition: 0.2s;
        }
        button:hover {
            background: #22cc22;
        }
        #qr {
            margin-top: 20px;
            display: none;
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #qr img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }
        #qr.show {
            display: flex;
        }
        #qr .download {
            margin-top: 10px;
            background: #1a1a1a;
            color: #33ff33;
            border: 1px solid #33ff33;
            padding: 6px 16px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }
        #qr .download:hover {
            background: #33ff33;
            color: #0a0a0a;
        }
        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: #115511;
            border-top: 1px solid #1a1a1a;
            padding-top: 12px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📱 QR GEN</h1>
    <div class="sub">╰─ by TBFPUMBA</div>

    <input type="text" id="textInput" placeholder="Введіть текст або посилання...">
    <button onclick="generateQR()">⚡ СТВОРИТИ QR</button>

    <div id="qr">
        <img id="qrImage" src="" alt="QR Code">
        <button class="download" onclick="downloadQR()">💾 Скачати PNG</button>
    </div>

    <div class="footer">
        © 2026 TBFPUMBA · Technology.Security.Efficiency
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
    let currentQR = null;

    function generateQR() {
        const input = document.getElementById('textInput').value.trim();
        const qrDiv = document.getElementById('qr');
        const qrImg = document.getElementById('qrImage');

        if (!input) {
            alert('❌ Введіть текст або посилання!');
            return;
        }

        // Використовуємо API для генерації QR
        const url = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(input)}`;
        qrImg.src = url;
        qrDiv.classList.add('show');
        currentQR = url;
    }

    function downloadQR() {
        if (!currentQR) return;
        const link = document.createElement('a');
        link.download = 'tbf_qr.png';
        link.href = currentQR;
        link.click();
    }
</script>
</body>
</html>
